name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      PAGES_BASE: /prince-of-peace-lutheran/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npx vite build
      - name: Prepare static site
        run: |
          set -euo pipefail
          if [ -d dist/client ]; then OUT=dist/client
          elif [ -d dist ]; then OUT=dist
          elif [ -d .output/public ]; then OUT=.output/public
          else
            echo "Could not find static output directory"
            ls -la
            exit 1
          fi
          touch "$OUT/.nojekyll"
          if [ -f "$OUT/index.html" ]; then cp "$OUT/index.html" "$OUT/404.html"; fi
          echo "OUT=$OUT" >> "$GITHUB_ENV"
      - name: Publish gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ${{ env.OUT }}
          branch: gh-pages
          clean: true
          force: true
